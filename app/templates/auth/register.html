{% extends 'base.html' %}

{% block content %}
<style>
.register-container {
    max-width: 500px;
    margin: 40px auto;
}
.register-card {
    background: var(--cp-bg-card, #ffffff);
    border-radius: 16px;
    border: 1px solid var(--cp-border-color, #e0e0e0);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}
</style>

<div class="register-container">
    <div class="register-card p-4 p-md-5">
        
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle mb-3" style="width: 56px; height: 56px;">
                <i class="fa-solid fa-user-plus fa-xl"></i>
            </div>
            <h3 class="fw-bold mb-1">Citizen Registration</h3>
            <p class="text-muted small mb-0">Create your account to report infrastructure issues and earn civic points.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-floating mb-3">
                <input type="text" name="name" class="form-control" id="nameInput" placeholder="Aarav Patil" required>
                <label for="nameInput"><i class="fa-solid fa-user me-1"></i> Full Name</label>
            </div>

            <div class="form-floating mb-3">
                <input type="email" name="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
                <label for="emailInput"><i class="fa-solid fa-envelope me-1"></i> Email Address</label>
            </div>

            <div class="form-floating mb-4">
                <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Password" required>
                <label for="passwordInput"><i class="fa-solid fa-lock me-1"></i> Create Password</label>
            </div>

            <button type="submit" class="btn btn-success w-100 py-3 fw-bold shadow-sm fs-6 mb-3">
                <i class="fa-solid fa-check-circle me-1"></i> Complete Registration
            </button>
        </form>

        <hr class="my-4">

        <div class="text-center small">
            <span class="text-muted">Already have an account?</span>
            <a href="{{ url_for('auth.login', portal='citizen') }}" class="fw-bold text-primary text-decoration-none ms-1">Sign In Here</a>
        </div>

    </div>
</div>
{% endblock %}
